server:
  port: 8081   # 8080 was taken by another app; backend runs on 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # --- Dev HTTPS (self-signed) — OFF by default so build/tests/e2e/dev keep working over HTTP.
  #     To test HTTPS locally: set ssl.enabled=true and ensure dev-keystore.p12 is on the
  #     classpath (generated via keytool, see SECURITY-NOTES.md). Prod terminates TLS at Nginx. ---
  ssl:
    enabled: false
    key-store: classpath:dev-keystore.p12
    key-store-password: frame-dev
    key-store-type: PKCS12
    key-alias: frame-dev

spring:
  application:
    name: frame-backend

  # --- MariaDB datasource (HikariCP pool, comes with Spring Boot) ---
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${FRAME_DB_HOST:localhost}:${FRAME_DB_PORT:3306}/${FRAME_DB_NAME:frame_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: frame_dev     # MariaDB root password (dev only — set via ALTER USER; rotate for prod)
    hikari:
      pool-name: FrameHikariPool
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # --- Jackson ---
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # --- Servlet multipart (review images: jpg/png ≤20MB per file, ≤9 per review) ---
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

  # --- Redis (stock gate, Stream buffer, cache) ---
  data:
    redis:
      host: ${FRAME_REDIS_HOST:localhost}
      port: ${FRAME_REDIS_PORT:6379}
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

# --- MyBatis-Plus ---
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.iflytek.frame.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # SQL logging in dev; remove for prod
  global-config:
    banner: false
    db-config:
      id-type: auto            # DB auto-increment primary key
      logic-delete-field: deleted   # logical-delete column (optional)
      logic-delete-value: 1
      logic-not-delete-value: 0

# --- JWT auth config (stateless; enables distributed deployment) ---
frame:
  jwt:
    secret: CHANGE_ME_TO_A_LONG_RANDOM_BASE64_SECRET_AT_LEAST_256_BITS_PLEASE_DO_NOT_USE_IN_PROD
    # Token validity, in seconds. 86400 = 24h.
    expire: 86400
    header: Authorization
    token-prefix: "Bearer "
  cors:
    # Allowed frontend origins (Vite dev server + local). Comma-separated.
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allow-credentials: true
  upload:
    dir: ./uploads        # configurable; NOT a Windows-absolute path (Linux-deploy-friendly)
  rate-limit:
    checkout-per-minute: 10
  sms:
    # provider 切换：logging（dev stub，不真发短信）/ aliyun（真实短信认证服务）。
    # 用环境变量 FRAME_SMS_PROVIDER=aliyun 切到真实短信，不在此处硬编码。
    provider: ${FRAME_SMS_PROVIDER:logging}
    cooldown-seconds: 60       # dev-stub cooldown only; prod relies on Aliyun's 防盗刷
    aliyun:
      # 全部走环境变量——凭据不进 git。本地默认空（用 logging stub）。
      access-key-id: ${FRAME_SMS_AK_ID:}
      access-key-secret: ${FRAME_SMS_AK_SECRET:}
      region: ${FRAME_SMS_REGION:cn-hangzhou}
      sign-name: ${FRAME_SMS_SIGN_NAME:}        # 系统赠送签名名称（控制台获取，如 恒创联众）
      template-code: ${FRAME_SMS_TEMPLATE_CODE:}  # 系统赠送模板编号（控制台获取，如 100001）

# --- SpringDoc OpenAPI (Swagger UI) ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.iflytek.frame.controller

logging:
  level:
    com.iflytek.frame: debug
    org.springframework.security: info
