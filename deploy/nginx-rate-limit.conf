# Frame Shop — Tier-1 edge rate-limit zone.
# This file declares the shared-memory zone. It MUST live at nginx `http` context,
# NOT inside a `server` block — `limit_req_zone` is rejected there and `nginx -t`
# fails. Ubuntu's default /etc/nginx/nginx.conf includes conf.d/*.conf at the
# `http` level, so dropping this file in /etc/nginx/conf.d/ makes the zone visible
# to all sites. The `limit_req` directive (which APPLIES the zone) lives in
# deploy/nginx.conf under `location = /api/checkout` (that one IS valid in a
# location block).
#
# Install:
#   sudo cp deploy/nginx-rate-limit.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;
