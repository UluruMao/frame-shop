# Frame Shop Nginx config — Kylin V10 (full nginx.conf replacement)
# Distributed: load-balances TWO backend instances (8081 + 8082) behind one upstream.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate-limit zone (http context — required here, not in server)
    limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;

    upstream frame_backend {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    server {
        listen 80;
        server_name _;

        # Frontend static files
        root /var/www/frame-frontend;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy /api/ → backend (strip /api prefix via trailing slash)
        location /api/ {
            proxy_pass http://frame_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint for chat (UC011)
        location /ws-chat {
            proxy_pass http://frame_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Served product images
        location /uploads/ {
            alias /var/lib/frame/uploads/;
        }

        # Gzip
        gzip on;
        gzip_types text/css application/javascript application/json;

        # Rate limiting on checkout
        location = /api/checkout {
            limit_req zone=checkout burst=20 nodelay;
            proxy_pass http://frame_backend/checkout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
