# Frame Shop Nginx config
# Copy to /etc/nginx/sites-available/frame-shop, symlink to sites-enabled, reload nginx.

server {
    listen 80;
    server_name _;  # replace with your domain/IP

    # Frontend static files
    root /var/www/frame-frontend;
    index index.html;

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api/ → backend (strip /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Served product images (uploaded static files)
    location /uploads/ {
        alias /var/lib/frame/uploads/;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Rate limiting (Tier-1 edge — Nginx level)
    limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;

    location = /api/checkout {
        limit_req zone=checkout burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081/checkout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
